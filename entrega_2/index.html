
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chatbot de vehículos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <main class="pagina-principal">

        <section class="contenedor-chatbots">

            <header class="encabezado">

                <h1 class="titulo-principal">
                    Chatbot de vehículos
                </h1>

                <p class="descripcion">
                    Selecciona el asistente virtual que deseas utilizar.
                    Puedes consultar información sobre vehículos y
                    recibir recomendaciones.
                </p>

            </header>

            <section class="opciones-chatbots">

                <button
                    type="button"
                    class="boton-chatbot boton-prolog"
                    id="btn-prolog"
                >
                    <i class="bi bi-robot"></i>

                    <span>Chatbot Prolog</span>
                </button>

                <button
                    type="button"
                    class="boton-chatbot boton-llm"
                    id="btn-llm"
                >
                    <i class="bi bi-chat-dots"></i>

                    <span>Chatbot LLM</span>
                </button>

            </section>

        </section>

    </main>

    <div id="contenedor-formulario"></div>
    <script src="ui.js"></script> 
</body>
</html>
